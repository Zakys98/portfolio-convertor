[project]
name = "portfolio-convertor"
version = "0.3.2"
description = "Magically transfers your portfolio to our standard"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2.12.5",
]

[project.scripts]
portfolio-convertor = "main:main"

[dependency-groups]
test = [
    "mypy>=2.3.0",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "types-openpyxl>=3.1.5.20250919",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
